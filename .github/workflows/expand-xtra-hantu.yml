name: Expand XTRA HANTU source

on:
  push:
    branches:
      - xtra-hantu-mvp
    paths:
      - .github/workflows/expand-xtra-hantu.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: xtra-hantu-mvp
          fetch-depth: 0

      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xtra-hantu-expanded /tmp/xtra-hantu-import /tmp/xtra-hantu.zip
          mkdir -p /tmp/xtra-hantu-import
          base64 --decode xtra-hantu/xtra-hantu.zip > /tmp/xtra-hantu.zip
          unzip -t /tmp/xtra-hantu.zip
          unzip -q /tmp/xtra-hantu.zip -d /tmp/xtra-hantu-import
          cp -a /tmp/xtra-hantu-import/xtra-hantu xtra-hantu-expanded
          find xtra-hantu-expanded -type f | sort

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtra-hantu-expanded
          if git diff --cached --quiet; then
            echo "Expanded source already matches bundle."
            exit 0
          fi
          git commit -m "chore: expand XTRA HANTU source bundle"
          git push origin HEAD:xtra-hantu-mvp
