name: XTRA HANTU CI

on:
  push:
    branches:
      - xtra-hantu-mvp
    paths:
      - xtra-hantu-expanded/**
      - .github/workflows/xtra-hantu-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xtra-hantu-expanded
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xtra-hantu-expanded/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and TypeScript check
        run: npm run build
